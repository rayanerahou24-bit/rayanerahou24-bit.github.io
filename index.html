<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Mini Projet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Ma To-Do List</h1>
            <p>Organisez vos tâches efficacement</p>
        </header>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-number active" id="activeCount">0</div>
                <div class="stat-label">Actives</div>
            </div>
            <div class="stat-item">
                <div class="stat-number completed" id="completedCount">0</div>
                <div class="stat-label">Terminées</div>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Ajouter une nouvelle tâche..." />
            <button id="addBtn" class="btn-add">Ajouter</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="active">Actives</button>
            <button class="filter-btn" data-filter="completed">Terminées</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <button id="clearCompleted" class="btn-clear">Supprimer les tâches terminées</button>

        <footer>
            <p>Mini-Projet Web - To-Do List Interactive</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
